name: Deploy Parkinson's Oracle to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FPC_VERSION: 3.2.2
  FPC_INSTALLER_URL: https://downloads.freepascal.org/fpc/dist/3.2.2/i386-win32/fpc-3.2.2.i386-win32.exe
  FPC_INSTALLER_SHA256: 7ec78b1790ecac7685f440b17f9e03865bc09846b7c068a9270c4d37704b5ac8
  PAS2JS_REVISION: fa10c59214cd226c60af465c831d66a7321f0214
  PAS2JS_SOURCE_SHA256: 5a2ad292c8606b899ba384d81b97e789171a335759b67e338d4a37903dbe18f1
  FPC_SOURCE_REVISION: d7f522a5611b13f37164c5eac87ade49b2f5b324
  FPC_SOURCE_SHA256: 84c70c67fd6b7da2be53bfc2613da2710a302432505489abdc732f89485fdc18

jobs:
  build:
    name: Build static Parkinson's Oracle site
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set toolchain paths
        shell: pwsh
        run: |
          $fpcDir = 'C:\FPC\3.2.2'
          $fpcBin = Join-Path $fpcDir 'bin\i386-win32'
          $pas2jsRoot = Join-Path $env:RUNNER_TEMP 'oracle-pas2js'
          $fpcBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FPC_ROOT=$fpcDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FPC=$(Join-Path $fpcBin 'fpc.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAS2JS_ROOT=$pas2jsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAS2JS=$(Join-Path $pas2jsRoot 'bin\pas2js.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAS2JS_RTL=$(Join-Path $pas2jsRoot 'dist\rtl.js')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAS2JS_UNITS=$(Join-Path $pas2jsRoot 'packages')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore FPC 3.2.2 cache
        id: fpc-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FPC_ROOT }}
          key: fpc-${{ runner.os }}-3.2.2-i386-win32-v1

      - name: Install verified FPC 3.2.2
        if: steps.fpc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'fpc-3.2.2.i386-win32.exe'
          Invoke-WebRequest -Uri $env:FPC_INSTALLER_URL -OutFile $installer
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:FPC_INSTALLER_SHA256) {
            throw "FPC installer SHA-256 mismatch: $actualHash"
          }
          $process = Start-Process -FilePath $installer -Wait -PassThru -WindowStyle Hidden -ArgumentList @(
            '/SP-'
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/DIR=$($env:FPC_ROOT)"
          )
          if ($process.ExitCode -ne 0) {
            throw "FPC installer exited with code $($process.ExitCode)."
          }
          Remove-Item -LiteralPath $installer -Force

      - name: Verify FPC version and system SQLite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (& $env:FPC -iV).Trim()
          Write-Host "FPC version: $ver"
          if ($ver -ne $env:FPC_VERSION) {
            throw "Expected FPC $($env:FPC_VERSION), found $ver."
          }
          $sqlitePath = Join-Path $env:SystemRoot 'System32\winsqlite3.dll'
          if (!(Test-Path -LiteralPath $sqlitePath)) {
            throw "Missing system winsqlite3.dll at $sqlitePath"
          }
          $sqliteVer = (Get-Item -LiteralPath $sqlitePath).VersionInfo.ProductVersion
          Write-Host "System winsqlite3.dll version: $sqliteVer"

      - name: Restore pinned pas2js toolchain cache
        id: pas2js-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PAS2JS_ROOT }}
          key: pas2js-${{ runner.os }}-fpc-${{ env.FPC_VERSION }}-${{ env.PAS2JS_REVISION }}-${{ env.FPC_SOURCE_REVISION }}-v1

      - name: Build pinned pas2js toolchain
        if: steps.pas2js-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP ('pas2js-build-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          try {
            $pas2jsTar = Join-Path $work 'pas2js.tar.gz'
            $fpcTar = Join-Path $work 'fpc-source.tar.gz'
            $pas2jsSrc = Join-Path $work 'pas2js'
            $fpcSrc = Join-Path $work 'fpc-source'
            New-Item -ItemType Directory -Path $pas2jsSrc, $fpcSrc -Force | Out-Null

            $pas2jsUrl = "https://gitlab.com/freepascal.org/fpc/pas2js/-/archive/$($env:PAS2JS_REVISION)/pas2js-$($env:PAS2JS_REVISION).tar.gz"
            $fpcUrl = "https://gitlab.com/freepascal.org/fpc/source/-/archive/$($env:FPC_SOURCE_REVISION)/source-$($env:FPC_SOURCE_REVISION).tar.gz"
            & curl.exe --fail --location --retry 3 --output $pas2jsTar $pas2jsUrl
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & curl.exe --fail --location --retry 3 --output $fpcTar $fpcUrl
            if ($LASTEXITCODE) { exit $LASTEXITCODE }

            $actualPas2js = (Get-FileHash -LiteralPath $pas2jsTar -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualPas2js -ne $env:PAS2JS_SOURCE_SHA256) {
              throw "pas2js archive SHA-256 mismatch: $actualPas2js"
            }
            $actualFpc = (Get-FileHash -LiteralPath $fpcTar -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualFpc -ne $env:FPC_SOURCE_SHA256) {
              throw "FPC source archive SHA-256 mismatch: $actualFpc"
            }

            $pas2jsPrefix = "pas2js-$($env:PAS2JS_REVISION)"
            $fpcPrefix = "source-$($env:FPC_SOURCE_REVISION)"
            & tar.exe -xzf $pas2jsTar --strip-components=1 -C $pas2jsSrc `
              "$pas2jsPrefix/packages" `
              "$pas2jsPrefix/COPYING.txt" `
              "$pas2jsPrefix/LICENSE"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & tar.exe -xzf $fpcTar --strip-components=1 -C $fpcSrc `
              "$fpcPrefix/packages/pastojs" `
              "$fpcPrefix/packages/fcl-passrc" `
              "$fpcPrefix/packages/fcl-js" `
              "$fpcPrefix/packages/fcl-json" `
              "$fpcPrefix/utils/pas2js"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }

            $unitsDir = Join-Path $work 'units'
            $binDir = Join-Path $env:PAS2JS_ROOT 'bin'
            $distDir = Join-Path $env:PAS2JS_ROOT 'dist'
            New-Item -ItemType Directory -Path $unitsDir, $binDir, $distDir -Force | Out-Null

            & $env:FPC -Mobjfpc -O2 `
              "-Fu$fpcSrc/packages/pastojs/src" `
              "-Fi$fpcSrc/packages/pastojs/src" `
              "-Fu$fpcSrc/packages/fcl-passrc/src" `
              "-Fi$fpcSrc/packages/fcl-passrc/src" `
              "-Fu$fpcSrc/packages/fcl-js/src" `
              "-Fi$fpcSrc/packages/fcl-js/src" `
              "-Fu$fpcSrc/packages/fcl-json/src" `
              "-Fi$fpcSrc/packages/fcl-json/src" `
              "-FU$unitsDir" `
              "-FE$binDir" `
              "$fpcSrc/utils/pas2js/pas2js.pp"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }

            Copy-Item -LiteralPath (Join-Path $fpcSrc 'utils/pas2js/dist/rtl.js') -Destination (Join-Path $distDir 'rtl.js') -Force
            Copy-Item -LiteralPath (Join-Path $pas2jsSrc 'packages') -Destination (Join-Path $env:PAS2JS_ROOT 'packages') -Recurse -Force
            foreach ($notice in @('LICENSE', 'COPYING.txt')) {
              $srcNotice = Join-Path $pas2jsSrc $notice
              if (Test-Path -LiteralPath $srcNotice -PathType Leaf) {
                Copy-Item -LiteralPath $srcNotice -Destination $env:PAS2JS_ROOT -Force
              }
            }
          } finally {
            Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify pinned pas2js version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (& $env:PAS2JS -iV).Trim()
          Write-Host "pas2js version: $ver"
          if ($ver -ne '3.3.1') {
            throw "Expected pas2js 3.3.1, found $ver."
          }

      - name: Restore catalog SQLite cache
        uses: actions/cache@v4
        with:
          path: build/parkinsons-oracle/catalog.sqlite3
          key: oracle-catalog-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            oracle-catalog-${{ runner.os }}-

      - name: Run portability unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testOut = 'build/parkinsons-oracle/ci-tests'
          New-Item -ItemType Directory -Path "$testOut/units", "$testOut/bin" -Force | Out-Null
          foreach ($t in @('compat.tests.lpr', 'graph.tests.lpr', 'presentation.tests.lpr', 'selection.tests.lpr', 'rubric.tests.lpr', 'ingredients.tests.lpr', 'recipes.tests.lpr')) {
            & $env:FPC -Mdelphi -Sa -Cr -Co -Ci -gl `
              -Fuexperiments/tools/parkinsons-oracle `
              -Fuexperiments/tools/vendor/wfc/src `
              -Fuexperiments/1000_see_what_sticks_food/tools `
              "-FU$testOut/units" "-FE$testOut/bin" `
              "experiments/tools/parkinsons-oracle/$t"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $exe = Join-Path "$testOut/bin" ($t -replace '\.lpr$', '.exe')
            & $exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Build static GitHub Pages site
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $siteDir = Join-Path $PWD 'build/parkinsons-oracle/pages-site'
          & ./experiments/tools/parkinsons-oracle/build-pages.ps1 `
            -Compiler $env:FPC `
            -Pas2js $env:PAS2JS `
            -Runtime $env:PAS2JS_RTL `
            -UnitRoot $env:PAS2JS_UNITS `
            -RepositoryUrl "https://github.com/$($env:GITHUB_REPOSITORY)" `
            -OutputDirectory $siteDir
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $rev = (git rev-parse --verify HEAD).Trim()
          foreach ($rel in @('index.html', '.nojekyll', 'app.js', 'rtl.js', 'oracle.css', 'recipes.json', "model/$rev/claims.json", "model/$rev/search/manifest.json", "model/$rev/search/documents.json")) {
            $full = Join-Path $siteDir $rel
            if (!(Test-Path -LiteralPath $full -PathType Leaf)) {
              throw "Missing required Pages file: $rel"
            }
          }
          $files = Get-ChildItem -LiteralPath $siteDir -File -Recurse
          $totalMB = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 2)
          Write-Host "Built GitHub Pages site: $($files.Count) files, $totalMB MB"

      - name: Upload built site artifact for Pages deployment
        uses: actions/upload-artifact@v4
        with:
          name: parkinsons-oracle-pages-site
          path: build/parkinsons-oracle/pages-site
          include-hidden-files: true
          retention-days: 1

  package:
    name: Package GitHub Pages artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: parkinsons-oracle-pages-site
          path: _site

      - name: Verify Pages entry point and .nojekyll
        run: |
          test -f _site/index.html
          test -f _site/.nojekyll
          test -f _site/app.js
          test -f _site/recipes.json
          ls -la _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
